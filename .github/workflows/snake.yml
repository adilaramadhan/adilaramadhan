name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: adilaramadhan
          outputs: |
            dist/github-snake.svg?color_snake=#FF4B4B&color_dots=#ebedf0,#ffcdd2,#e57373,#e53935,#b71c1c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4B4B&color_dots=#161b22,#4c111a,#7d1927,#c52233,#ff4b4b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
